<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Конфигуратор обоев</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f4f5;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#111827}
    @media(prefers-color-scheme:dark){:root{--bg:#111315;--panel:#191c20;--text:#f4f4f5;--muted:#9ca3af;--border:#2a2f36;--accent:#fff}}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{min-height:100vh;display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:24px;padding:24px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06);align-self:start;position:sticky;top:24px}h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:20px}.section{padding:16px 0;border-top:1px solid var(--border)}.section:first-of-type{border-top:none;padding-top:0}.section h2{font-size:14px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}label{font-size:12px;color:var(--muted)}input[type="text"],input[type="number"],select{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:transparent;color:var(--text);outline:none}input[type="color"]{width:100%;height:42px;border:none;padding:0;background:none;border-radius:10px;overflow:hidden;cursor:pointer}input[type="range"]{width:100%}.range-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.check{display:flex;align-items:center;gap:10px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}button{border:1px solid var(--border);background:transparent;color:var(--text);padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:600}button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent)}.preview-wrap{min-width:0;display:flex;align-items:flex-start;justify-content:center;padding:8px}.preview-card{background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.1);max-width:100%}canvas{display:block;max-width:min(100%,560px);height:auto;border-radius:18px;background:#8e88f6}.meta{margin-top:10px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}.panel{position:static}.preview-wrap{order:-1}}
  </style>
</head>
<body>
<div class="app"><aside class="panel"><h1>Конфигуратор обоев</h1><div class="sub">Настрой цвет, точки, градиент и надпись. Экспорт — PNG/JPG.</div>
<div class="section"><h2>Размер</h2><div class="row"><div class="field"><label>Ширина</label><input id="width" type="number" min="320" max="6000" value="1290"></div><div class="field"><label>Высота</label><input id="height" type="number" min="320" max="6000" value="2796"></div></div><div class="field"><label>Пресет</label><select id="preset"><option value="1290x2796">iPhone 16/17 Pro Max — 1290×2796</option><option value="1206x2622">iPhone 16/17 Pro — 1206×2622</option><option value="1179x2556">iPhone 15/14 Pro — 1179×2556</option><option value="1170x2532">iPhone 13/14 — 1170×2532</option><option value="custom">Свой размер</option></select></div></div>
<div class="section"><h2>Фон</h2><div class="row"><div class="field"><label>Цвет 1</label><input id="bg1" type="color" value="#7d74f6"></div><div class="field"><label>Цвет 2</label><input id="bg2" type="color" value="#9b96ff"></div></div><div class="field"><div class="range-head"><span>Интенсивность градиента</span><span id="gradVal">55%</span></div><input id="grad" type="range" min="0" max="100" value="55"></div><div class="field"><div class="range-head"><span>Виньетка</span><span id="vigVal">12%</span></div><input id="vig" type="range" min="0" max="50" value="12"></div></div>
<div class="section"><h2>Точки</h2><div class="row"><div class="field"><label>Цвет точек</label><input id="dotColor" type="color" value="#ffffff"></div><div class="field"><label>Прозрачность</label><input id="dotAlpha" type="number" min="0" max="1" step="0.05" value="0.65"></div></div><div class="field"><div class="range-head"><span>Размер точек</span><span id="dotSizeVal">2.2</span></div><input id="dotSize" type="range" min="0.5" max="8" step="0.1" value="2.2"></div><div class="field"><div class="range-head"><span>Расстояние</span><span id="spacingVal">18</span></div><input id="spacing" type="range" min="6" max="40" step="1" value="18"></div><div class="field"><label class="check"><input id="offsetRows" type="checkbox"> Смещать каждую вторую строку</label></div></div>
<div class="section"><h2>Надпись</h2><div class="field"><label>Текст</label><input id="text" type="text" value="hello"></div><div class="row"><div class="field"><label>Цвет текста</label><input id="textColor" type="color" value="#ffffff"></div><div class="field"><label>Шрифт</label><select id="fontFamily"><option value="appleHelloVector" selected>Приветствие iPhone / Apple Hello</option><option value='"SignPainter","SignPainter-HouseScript","SignPainter HouseScript","Snell Roundhand","Apple Chancery",cursive'>Apple-подобный script</option><option value='"Snell Roundhand","Apple Chancery","Segoe Script",cursive'>Snell Roundhand</option><option value='"Apple Chancery","Snell Roundhand",cursive'>Apple Chancery</option><option value='"Segoe Script","Brush Script MT",cursive'>Segoe Script</option><option value='"Brush Script MT","Segoe Script",cursive'>Brush Script</option></select></div></div><div class="field"><div class="range-head"><span>Размер текста</span><span id="fontSizeVal">10%</span></div><input id="fontSize" type="range" min="4" max="24" step="0.5" value="10"></div><div class="field"><div class="range-head"><span>Позиция по вертикали</span><span id="textYVal">72%</span></div><input id="textY" type="range" min="10" max="92" step="1" value="72"></div><div class="field"><label class="check"><input id="showText" type="checkbox" checked> Показывать надпись</label></div></div>
<div class="section"><h2>Экспорт</h2><div class="row"><div class="field"><label>Формат</label><select id="format"><option value="png">PNG</option><option value="jpeg">JPG</option></select></div><div class="field"><label>JPG качество</label><input id="quality" type="number" min="0.1" max="1" step="0.05" value="0.95"></div></div><div class="actions"><button id="randomBtn">Случайный цвет</button><button id="resetBtn">Сбросить</button><button class="primary" id="exportBtn" style="grid-column:1/-1">Экспортировать</button></div></div></aside>
<main class="preview-wrap"><div class="preview-card"><canvas id="canvas" width="1290" height="2796"></canvas><div class="meta" id="meta">1290×2796</div></div></main></div>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const ids=['width','height','preset','bg1','bg2','grad','vig','dotColor','dotAlpha','dotSize','spacing','offsetRows','text','textColor','fontFamily','fontSize','textY','showText','format','quality'];
function hexToRgb(hex){const n=parseInt(hex.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}function mix(a,b,t){return Math.round(a+(b-a)*t)}
function drawAppleHello(ctx,cx,cy,targetWidth,color){const W=760,H=220,scale=targetWidth/W,ox=cx-(W*scale)/2,oy=cy-(H*scale)/2;ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=17;ctx.strokeStyle=color;const p=new Path2D();p.moveTo(30,176);p.bezierCurveTo(34,126,40,74,54,24);p.bezierCurveTo(60,8,82,8,88,26);p.bezierCurveTo(92,40,88,63,82,95);p.bezierCurveTo(78,116,77,137,82,157);p.bezierCurveTo(92,135,106,117,129,106);p.bezierCurveTo(157,93,184,104,194,136);p.bezierCurveTo(202,163,199,177,210,177);p.bezierCurveTo(224,177,236,162,243,145);p.bezierCurveTo(251,125,247,106,228,101);p.bezierCurveTo(201,94,180,124,186,153);p.bezierCurveTo(192,182,223,195,253,184);p.bezierCurveTo(272,177,286,164,298,144);p.bezierCurveTo(309,126,320,104,331,76);p.bezierCurveTo(344,42,350,16,364,15);p.bezierCurveTo(382,14,385,40,378,78);p.bezierCurveTo(372,112,368,145,373,171);p.bezierCurveTo(377,186,387,189,397,178);p.bezierCurveTo(410,165,420,139,431,102);p.bezierCurveTo(442,63,450,20,468,18);p.bezierCurveTo(487,16,491,46,484,88);p.bezierCurveTo(477,128,476,160,483,181);p.bezierCurveTo(488,194,500,194,514,178);p.bezierCurveTo(529,161,536,141,545,131);p.bezierCurveTo(565,108,593,106,610,122);p.bezierCurveTo(626,137,624,165,607,181);p.bezierCurveTo(589,198,560,197,546,181);p.bezierCurveTo(534,167,536,145,550,134);p.bezierCurveTo(563,124,580,125,590,136);p.bezierCurveTo(598,145,600,157,596,168);p.bezierCurveTo(593,178,608,179,628,171);p.bezierCurveTo(651,161,667,145,682,132);p.bezierCurveTo(698,119,716,116,730,129);p.bezierCurveTo(741,139,741,155,729,165);ctx.stroke(p);ctx.restore()}
function render(){const w=Math.max(320,+$('width').value||1290),h=Math.max(320,+$('height').value||2796);if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;$('meta').textContent=`${w}×${h}`;const c1=hexToRgb($('bg1').value),c2=hexToRgb($('bg2').value),gradStrength=+$('grad').value/100,g=ctx.createLinearGradient(0,0,w,h),m1=`rgb(${c1.r},${c1.g},${c1.b})`,blend={r:mix(c1.r,c2.r,gradStrength),g:mix(c1.g,c2.g,gradStrength),b:mix(c1.b,c2.b,gradStrength)},m2=`rgb(${blend.r},${blend.g},${blend.b})`;g.addColorStop(0,m2);g.addColorStop(.45,m2);g.addColorStop(1,m1);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const vig=+$('vig').value/100;if(vig>0){const rg=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.15,w/2,h/2,Math.max(w,h)*.72);rg.addColorStop(0,'rgba(255,255,255,0)');rg.addColorStop(1,`rgba(0,0,0,${vig})`);ctx.fillStyle=rg;ctx.fillRect(0,0,w,h)}const dotRgb=hexToRgb($('dotColor').value);ctx.fillStyle=`rgba(${dotRgb.r},${dotRgb.g},${dotRgb.b},${Math.min(1,Math.max(0,+$('dotAlpha').value||0))})`;const radius=+$('dotSize').value,spacing=+$('spacing').value,offset=$('offsetRows').checked;let row=0;for(let y=spacing/2;y<h;y+=spacing){const xStart=spacing/2+(offset&&row%2?spacing/2:0);for(let x=xStart;x<w;x+=spacing){ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill()}row++}if($('showText').checked&&$('text').value.trim()){const fontSizePx=h*(+$('fontSize').value/100),text=$('text').value.trim();ctx.save();ctx.fillStyle=$('textColor').value;ctx.strokeStyle=$('textColor').value;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fontKerning='normal';if($('fontFamily').value==='appleHelloVector'&&text.toLowerCase()==='hello')drawAppleHello(ctx,w/2,h*(+$('textY').value/100),fontSizePx*2.55,$('textColor').value);else{const fontFamily=$('fontFamily').value==='appleHelloVector'?'"SignPainter","SignPainter-HouseScript","SignPainter HouseScript","Snell Roundhand","Apple Chancery",cursive':$('fontFamily').value;ctx.font=`${fontSizePx}px ${fontFamily}`;ctx.fillText(text,w/2,h*(+$('textY').value/100))}ctx.restore()}$('gradVal').textContent=`${$('grad').value}%`;$('vigVal').textContent=`${$('vig').value}%`;$('dotSizeVal').textContent=$('dotSize').value;$('spacingVal').textContent=$('spacing').value;$('fontSizeVal').textContent=`${$('fontSize').value}%`;$('textYVal').textContent=`${$('textY').value}%`}
ids.forEach(id=>$(id).addEventListener('input',render));$('preset').addEventListener('change',e=>{if(e.target.value==='custom')return;const[w,h]=e.target.value.split('x');$('width').value=w;$('height').value=h;render()});
function hslToHex(h,s,l){s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');return`#${toHex(r)}${toHex(g)}${toHex(b)}`}
$('randomBtn').addEventListener('click',()=>{const hue=Math.floor(Math.random()*360),hue2=(hue+8+Math.floor(Math.random()*18))%360,sat1=38+Math.floor(Math.random()*16),sat2=34+Math.floor(Math.random()*16),light1=68+Math.floor(Math.random()*10),light2=76+Math.floor(Math.random()*9);$('bg1').value=hslToHex(hue,sat1,light1);$('bg2').value=hslToHex(hue2,sat2,light2);render()});
$('resetBtn').addEventListener('click',()=>{$('width').value=1290;$('height').value=2796;$('preset').value='1290x2796';$('bg1').value='#7d74f6';$('bg2').value='#9b96ff';$('grad').value=55;$('vig').value=12;$('dotColor').value='#ffffff';$('dotAlpha').value=.65;$('dotSize').value=2.2;$('spacing').value=18;$('offsetRows').checked=false;$('text').value='hello';$('textColor').value='#ffffff';$('fontFamily').value='appleHelloVector';$('fontSize').value=10;$('textY').value=72;$('showText').checked=true;$('format').value='png';$('quality').value=.95;render()});
$('exportBtn').addEventListener('click',async()=>{render();const format=$('format').value,mime=format==='jpeg'?'image/jpeg':'image/png',ext=format==='jpeg'?'jpg':'png',quality=Math.min(1,Math.max(.1,+$('quality').value||.95)),filename=`wallpaper-${canvas.width}x${canvas.height}.${ext}`,btn=$('exportBtn'),oldText=btn.textContent;btn.disabled=true;btn.textContent='Подготовка…';try{const blob=await new Promise((resolve,reject)=>{canvas.toBlob(b=>b?resolve(b):reject(new Error('Не удалось создать изображение')),mime,quality)}),file=new File([blob],filename,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Обои'});return}catch(e){if(e&&e.name==='AbortError')return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();if(!('download' in HTMLAnchorElement.prototype))window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){alert('Экспорт не удался: '+(e?.message||e))}finally{btn.disabled=false;btn.textContent=oldText}});render();
</script></body></html>
